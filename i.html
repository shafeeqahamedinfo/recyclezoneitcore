
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Certificate</title>
    <link rel="stylesheet" href="style.css">
    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Georgia", serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.certificate{
    width:1000px;
    height:700px;
    background:white;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.border{
    width:100%;
    height:100%;
    border:12px solid #c8a24d;
    padding:60px;
    text-align:center;
    position:relative;
}

h1{
    color:#1f3a5f;
    font-size:42px;
    letter-spacing:3px;
    margin-bottom:40px;
}

.presented{
    font-size:22px;
    color:#555;
    margin-bottom:20px;
}

h2{
    font-size:52px;
    color:#b8860b;
    margin-bottom:30px;
    border-bottom:2px solid #c8a24d;
    display:inline-block;
    padding-bottom:10px;
}

.description{
    font-size:20px;
    color:#444;
    line-height:1.8;
    max-width:700px;
    margin:0 auto 60px;
}

.details{
    display:flex;
    justify-content:space-between;
    margin:0 50px 80px;
}

.label{
    font-weight:bold;
    color:#1f3a5f;
    margin-bottom:5px;
}

.signatures{
    display:flex;
    justify-content:space-between;
    margin-top:50px;
}

.signature{
    width:250px;
    text-align:center;
}

.line{
    border-top:2px solid #000;
    margin-bottom:10px;
}</style>
</head>
<body>

<div class="certificate">
    <div class="border">
        <h1>CERTIFICATE OF ACHIEVEMENT</h1>

        <p class="presented">This Certificate is Proudly Presented To</p>

        <h2>John Doe</h2>

        <p class="description">
            In recognition of outstanding performance, dedication,
            and successful completion of the program.
        </p>

        <div class="details">
            <div>
                <p class="label">Date</p>
                <p>16 June 2026</p>
            </div>

            <div>
                <p class="label">Certificate ID</p>
                <p>CERT-2026-001</p>
            </div>
        </div>

        <div class="signatures">
            <div class="signature">
                <div class="line"></div>
                <p>Authorized Signature</p>
            </div>

            <div class="signature">
                <div class="line"></div>
                <p>Director</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
